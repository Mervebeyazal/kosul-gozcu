name: Verify and record demo
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm test && npm run test:service
      - run: node eval/fetch.mjs && npm run eval
      - run: node fixtures.mjs
      - uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: http://127.0.0.1:4317
          browser: chrome
      - name: Check video duration
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          seconds=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 cypress/videos/demo.cy.js.mp4)
          awk -v s="$seconds" 'BEGIN { if(s > 90 || s <= 0) exit 1; print "Video duration:",s }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-and-eval
          path: |
            cypress/videos/
            cypress/screenshots/
            eval/REPORT.md
            eval/results.json
